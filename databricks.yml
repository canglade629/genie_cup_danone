bundle:
  name: shelf-optimizer

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog containing shelf optimizer data
    default: serverless_stable_6hzlm4_catalog
  schema:
    description: Unity Catalog schema containing shelf optimizer data
    default: shelf_optimizer
  sql_warehouse_id:
    description: SQL Warehouse ID
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.

resources:
  apps:
    app:
      name: 'shelf-optimizer'
      description: 'Danone shelf optimizer: share-of-shelf, next-best-action, and planogram compliance for sales reps'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: 'Shelf Optimizer Assistant'
            space_id: ${resources.genie_spaces.shelf_optimizer_genie.id}
            permission: CAN_RUN
        - name: shelf-images
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.shelf_images
            securable_type: VOLUME
            permission: READ_VOLUME

targets:
  default:
    default: true
    workspace:
      host: https://fevm-serverless-stable-6hzlm4.cloud.databricks.com

    variables:
      catalog: serverless_stable_6hzlm4_catalog
      schema: shelf_optimizer
      sql_warehouse_id: 5b025499976234e9
      postgres_branch: projects/shelf-optimizer/branches/production
      postgres_database: projects/shelf-optimizer/branches/production/databases/databricks-postgres
      postgres_project: projects/shelf-optimizer
